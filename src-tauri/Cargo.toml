[package]
name = "pelican-mods"
version = "0.2.0"
description = "Stardew Valley launcher and mod manager for macOS"
authors = ["swchck"]
edition = "2024"

[lib]
# the `_lib` suffix keeps the lib name distinct from the bin, see https://github.com/rust-lang/cargo/issues/8519
name = "pelican_mods_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2", "system-proxy", "stream"] }
tokio = { version = "1.53.2", features = ["time", "sync", "process", "io-util", "fs", "macros", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
json5 = "1"
keyring = { version = "3", features = ["apple-native"] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sevenz-rust2 = "0.24"
unrar = "0.5"
url = "2"
quick-xml = "0.42"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
trash = "5.2.9"

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
